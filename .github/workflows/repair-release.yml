name: Repair v0.1.2 release assets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-existing-tag:
    uses: ./.github/workflows/release.yml
    with:
      release_ref: v0.1.2
    secrets: inherit
