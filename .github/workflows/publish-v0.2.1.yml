# Publish the approved v0.2.1 release from the commit containing this request.
name: Publish v0.2.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.2.1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      release_ref: ${{ github.sha }}
    secrets: inherit
