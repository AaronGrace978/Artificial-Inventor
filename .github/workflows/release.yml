name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - name: Build Windows installer and update metadata
        run: npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - name: Publish and verify complete release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = "Artificial-Inventor-Setup-$version-x64.exe"
          foreach ($file in @("dist/$installer", 'dist/latest.yml')) {
            if (!(Test-Path $file)) { throw "Required release asset missing: $file" }
          }
          $metadata = Get-Content dist/latest.yml -Raw
          if ($metadata -notmatch 'sha512:\s*(\S+)') { throw 'Update metadata has no checksum' }
          $expected = $Matches[1]
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path "dist/$installer"))
          $actual = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData($bytes))
          if ($actual -ne $expected) { throw 'Installer does not match update metadata' }
          gh release view $tag --json tagName
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Artificial Inventor $version" --notes-file docs/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          }
          $assets = Get-ChildItem dist/*.exe,dist/*.blockmap,dist/latest.yml | ForEach-Object { $_.FullName }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          $ready = $false
          for ($attempt = 0; $attempt -lt 6; $attempt++) {
            $publishedJson = gh release view $tag --json assets
            if ($LASTEXITCODE -eq 0) {
              $published = $publishedJson | ConvertFrom-Json
              $ready = $true
              foreach ($name in @($installer, 'latest.yml')) {
                $expectedSize = (Get-Item "dist/$name").Length
                $asset = @($published.assets | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' -and $_.size -eq $expectedSize })
                if ($asset.Count -ne 1) { $ready = $false }
              }
              if ($ready) { break }
              $published.assets | Select-Object name,state,size | ConvertTo-Json
            }
            Start-Sleep -Seconds 5
          }
          if (!$ready) { Write-Host 'Asset-list metadata is not current; checking downloadable bytes directly.' }
          $downloaded = $false
          $verifyDirectory = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString())
          for ($attempt = 0; $attempt -lt 12; $attempt++) {
            gh release download $tag --pattern $installer --pattern latest.yml --dir $verifyDirectory --skip-existing
            if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
            Start-Sleep -Seconds 5
          }
          if (!$downloaded) { throw 'Published assets could not be downloaded after bounded retries' }
          $remoteMetadata = Get-Content (Join-Path $verifyDirectory 'latest.yml') -Raw
          if ($remoteMetadata -notmatch 'sha512:\s*(\S+)') { throw 'Published metadata has no checksum' }
          $remoteExpected = $Matches[1]
          $remoteBytes = [IO.File]::ReadAllBytes((Join-Path $verifyDirectory $installer))
          $remoteActual = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData($remoteBytes))
          if ($remoteActual -ne $remoteExpected -or $remoteActual -ne $expected) { throw 'Published installer checksum mismatch' }
          gh release edit $tag --latest --title "Artificial Inventor $version" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not finalize the release' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-build
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
